name: validate
on: [push, pull_request]
jobs:
  laboratories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python scripts/validate_materials.py --full
