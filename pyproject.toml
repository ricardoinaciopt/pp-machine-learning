[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-course"
version = "0.1.0"
description = "Shared utilities for the experimental notebooks"
requires-python = ">=3.10"
license = {file = "LICENSES/MIT.txt"}

[tool.setuptools.packages.find]
where = ["src"]
